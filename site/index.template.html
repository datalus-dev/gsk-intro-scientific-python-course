<title>Intro to Scientific Python</title>
<style>
  :root {
    --bg: #fdf6e3;
    --surface: #ffffff;
    --text: #3d4f5c;
    --text-muted: #6b7a86;
    --border: #e5dcc3;
    --accent: #3d4f5c;

    --locked-bg: #f3efe4;
    --locked-border: #ddd5bf;
    --locked-text: #a49d8a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #23201a;
      --surface: #2d2a22;
      --text: #f0e9d8;
      --text-muted: #a89d84;
      --border: #46402f;
      --accent: #f0e9d8;

      --locked-bg: #29261f;
      --locked-border: #3a3527;
      --locked-text: #6b6452;
    }
  }

  :root[data-theme="dark"] {
    --bg: #23201a;
    --surface: #2d2a22;
    --text: #f0e9d8;
    --text-muted: #a89d84;
    --border: #46402f;
    --accent: #f0e9d8;

    --locked-bg: #29261f;
    --locked-border: #3a3527;
    --locked-text: #6b6452;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 2.5rem 1rem;
    display: flex;
  }

  main {
    width: 100%;
    max-width: 720px;
    margin: auto;
  }

  header {
    margin-bottom: 2rem;
    text-align: center;
  }

  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    color: var(--text-muted);
    margin: 0;
  }

  .format-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 1rem;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .format-toggle .segments {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    padding: 2px;
  }

  .format-toggle button {
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--text-muted);
    font: inherit;
    font-weight: 600;
    padding: 0.25rem 0.9rem;
    cursor: pointer;
  }

  .format-toggle button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--bg);
  }

  .format-toggle button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.9rem;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    position: relative;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 1.1rem 1.2rem;
    min-height: 108px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  a.card.unavailable {
    opacity: 0.45;
    cursor: default;
  }

  a.card.unavailable:hover {
    border-color: var(--border);
    transform: none;
  }

  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .card .eyebrow {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.35rem;
  }

  .card .title {
    font-size: 0.95rem;
    font-weight: 600;
    line-height: 1.3;
  }

  .card .date {
    margin-top: 0.4rem;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .card.locked {
    background: var(--locked-bg);
    border-color: var(--locked-border);
    color: var(--locked-text);
    cursor: default;
  }

  .card.locked .eyebrow,
  .card.locked .date {
    color: var(--locked-text);
  }

  .card.locked .title {
    color: var(--locked-text);
    font-weight: 500;
  }

  .card .lock-icon {
    position: absolute;
    top: 0.9rem;
    right: 0.95rem;
    width: 14px;
    height: 14px;
    opacity: 0.5;
  }

  footer {
    margin-top: 1.75rem;
    text-align: center;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  footer a {
    color: inherit;
  }
</style>

<main>
  <header>
    <h1>Intro to Scientific Python</h1>
    <p class="subtitle">G440 &middot; GSK &middot; Fall 2026</p>
    <div class="format-toggle">
      <span>Open as</span>
      <div class="segments" role="group" aria-label="Format">
        <button type="button" data-format="html" aria-pressed="true">HTML</button>
        <button type="button" data-format="pdf" aria-pressed="false">PDF</button>
        <button type="button" data-format="jupyterlite" aria-pressed="false">JupyterLite</button>
        <button type="button" data-format="ipynb" aria-pressed="false">ipynb</button>
      </div>
    </div>
  </header>

  <div class="grid">
<!-- MODULES -->
  </div>

  <footer>
    <a href="jupyterlite/repl/index.html">Live Python Console (JupyterLite)</a> &middot;
    <a href="https://github.com/datalus-dev/gsk-intro-scientific-python-course">Course repository on GitHub</a>
  </footer>
</main>

<script>
  (function () {
    var FORMATS = ['html', 'pdf', 'jupyterlite', 'ipynb'];
    var buttons = document.querySelectorAll('.format-toggle button');
    var cards = document.querySelectorAll('a.card[data-html]');

    function apply(format) {
      cards.forEach(function (card) {
        var href = card.dataset[format];
        card.classList.toggle('unavailable', !href);
        if (href) {
          card.setAttribute('href', href);
          card.removeAttribute('aria-disabled');
        } else {
          card.removeAttribute('href');
          card.setAttribute('aria-disabled', 'true');
        }
        if (format === 'ipynb') {
          card.setAttribute('download', '');
        } else {
          card.removeAttribute('download');
        }
        if (format === 'jupyterlite') {
          card.setAttribute('target', '_blank');
          card.setAttribute('rel', 'noopener');
        } else {
          card.removeAttribute('target');
          card.removeAttribute('rel');
        }
      });
      buttons.forEach(function (button) {
        button.setAttribute('aria-pressed', String(button.dataset.format === format));
      });
    }

    var saved = 'html';
    try {
      var stored = localStorage.getItem('format');
      if (FORMATS.indexOf(stored) !== -1) saved = stored;
    } catch (e) {}
    apply(saved);

    buttons.forEach(function (button) {
      button.addEventListener('click', function () {
        apply(button.dataset.format);
        try {
          localStorage.setItem('format', button.dataset.format);
        } catch (e) {}
      });
    });
  })();
</script>
