name: Deploy Course Site

on:
  push:
    branches: [main]
    paths:
      - jupyter_lite_config.json
      - jupyterlite/**
      - modules/**
      - site/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-jupyterlite.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install JupyterLite build tools
        run: pip install jupyterlite-core jupyterlite-pyodide-kernel pyodide-lock packaging uv jupyter-server

      - name: Build JupyterLite site
        run: jupyter lite build --output-dir _site/jupyterlite --contents jupyterlite

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install slide build tools
        run: npm ci

      - name: Build module slides
        run: |
          mkdir -p _site/modules/html
          for f in modules/module_*.md; do
            # Only modules rewritten for 2026 have an active (uncommented)
            # `title:` in their frontmatter; others are last year's drafts.
            if grep -qE '^title:' "$f"; then
              name=$(basename "$f" .md)
              npx marp --html "$f" -o "_site/modules/html/${name}.html"
            fi
          done

      - name: Copy slide assets
        run: |
          mkdir -p _site/syllabus/2026
          cp syllabus/2026/instructor-teon-photo.png syllabus/2026/instructor-tejiri-photo.png _site/syllabus/2026/

      - name: Generate landing page
        run: node site/generate-index.js _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
